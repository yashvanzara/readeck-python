name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint with ruff
        run: |
          uv run ruff check src tests

      - name: Check formatting with ruff
        run: |
          uv run ruff format --check src tests

      - name: Type check with mypy
        run: |
          uv run mypy src

      - name: Test with pytest
        run: |
          uv run pytest --cov=src/readeck --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Pull Readeck image
        run: docker compose -p readeck-python-itest -f tests/integration/compose.yaml pull

      - name: Run integration tests
        run: uv run pytest tests/integration -v

      - name: Tear down leftover Compose stack
        if: always()
        run: |
          docker compose -p readeck-python-itest -f tests/integration/compose.yaml down -v --remove-orphans --timeout 10 || true

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
